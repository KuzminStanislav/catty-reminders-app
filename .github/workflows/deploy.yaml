name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.space
          username: qzm
          port: 3149
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/qzm/Desktop/catty-reminders-app

            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            export IMAGE="ghcr.io/$OWNER/catty-reminders-app:${{ github.sha }}"

            export APP_CONTAINER_NAME="catty-app"
            export DB_CONTAINER_NAME="catty-db"

            export MYSQL_ROOT_PASSWORD="rootpass"
            export MYSQL_DATABASE="catty_reminders"
            export MYSQL_USER="catty"
            export MYSQL_PASSWORD="cattypass"

            export HOST_APP_PORT="8181"
            export CONTEINER_APP_PORT="8181"
            export HOST_DB_PORT="3306"
            export CONTEINER_DB_PORT="3306"

            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            sudo -E docker compose down -v || true
            sudo -E docker compose up -d --pull always --remove-orphans --force-recreate
