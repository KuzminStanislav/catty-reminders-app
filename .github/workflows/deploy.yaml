name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.space
          username: qzm
          port: 3149
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/qzm/Desktop/catty-reminders-app

            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_URL="ghcr.io/$OWNER/catty-reminders-app:${{ github.sha }}"

            cat <<EOF > .env
            IMAGE=$IMAGE_URL
            APP_CONTAINER_NAME=catty-app
            DB_CONTAINER_NAME=catty-db
            MYSQL_ROOT_PASSWORD=rootpass
            MYSQL_DATABASE=catty_reminders
            MYSQL_USER=catty
            MYSQL_PASSWORD=cattypass
            HOST_APP_PORT=8181
            CONTAINER_APP_PORT=8181
            HOST_DB_PORT=3306
            CONTAINER_DB_PORT=3306
            DEPLOY_REF=${{ github.sha }}
            EOF

            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            sudo docker compose down || true
            
            sudo docker compose up -d --pull always --remove-orphans --force-recreate
