services:
  db:
    image: mysql:8.0
    container_name: ${DB_CONTAINER_NAME:-catty-db}
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-catty_reminders}
      MYSQL_USER: ${MYSQL_USER:-catty}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cattypass}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - catty-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  catty-app:
    image: ${IMAGE:-ghcr.io/kuzminstanislav/catty-reminders-app:latest}
    container_name: ${APP_CONTAINER_NAME:-catty-app}
    restart: always
    environment:
      DEPLOY_REF: ${DEPLOY_REF:-latest}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-catty}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cattypass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-catty_reminders}
    ports:
      - "${HOST_APP_PORT:-8181}:${CONTAINER_APP_PORT:-8181}"
    volumes:
      - ./config.json:/catty-reminders-app/config.json:ro
      - ./reminder_db.json:/catty-reminders-app/reminder_db.json
    depends_on:
      db:
        condition: service_healthy
    networks:
      - catty-network
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  catty-network:
    driver: bridge

volumes:
  db_data:
